name: Publish SaveVault Server Docker image

on:
  push:
    tags:
      - 'server-v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version to publish, for example v1.10.0
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/jun9100/savevault-server
  DOCKERHUB_IMAGE: docker.io/jun9100/savevault-server

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: version
        name: Select release version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          version="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          version="${version#server-}"
          case "$version" in
            v*) ;;
            *) echo "version must start with v (or server-v)" >&2; exit 1 ;;
          esac
          plain="${version#v}"
          short_sha="${GITHUB_SHA::7}"
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${GHCR_IMAGE}:${version}"
            echo "${GHCR_IMAGE}:${plain}"
            echo "${GHCR_IMAGE}:latest"
            echo "${GHCR_IMAGE}:sha-${short_sha}"
            if [ "$HAS_DOCKERHUB" = "true" ]; then
              echo "${DOCKERHUB_IMAGE}:${version}"
              echo "${DOCKERHUB_IMAGE}:${plain}"
              echo "${DOCKERHUB_IMAGE}:latest"
              echo "${DOCKERHUB_IMAGE}:sha-${short_sha}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (optional)
        if: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: jun9100
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.version.outputs.value }}
          labels: |
            org.opencontainers.image.source=https://github.com/jun9100/SaveVault
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          tags: ${{ steps.version.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
