<div id="login" class="login" hidden>
  <button class="icon-btn login-theme" type="button" data-action="theme" title="切换主题" aria-label="切换主题"><svg><use href="#i-moon"/></svg></button>
  <form class="login-card" id="login-form" autocomplete="on">
    <div class="login-mark"><svg><use href="#i-logo"/></svg></div>
    <div class="login-heading">
      <span class="login-pill">CLOUD VAULT CONSOLE</span>
      <h1>SaveVault 云端</h1>
      <p>输入管理员令牌（<code>GAME_SAVE_ADMIN_TOKEN</code>）以管理存档、设备、用户与存储策略。</p>
    </div>
    <label class="field">
      <span>管理员令牌</span>
      <div class="input-wrap">
        <input id="login-token" name="password" type="password" autocomplete="current-password" placeholder="输入管理员令牌…" required autofocus>
        <button class="icon-btn input-toggle" type="button" id="login-token-toggle" title="显示令牌" aria-label="显示令牌"><svg><use href="#i-eye"/></svg></button>
      </div>
    </label>
    <p class="form-error" id="login-error" role="alert"></p>
    <button class="btn primary block" type="submit">进入控制台</button>
    <small class="login-foot">会话安全保存 7 天 · 端到端加密存档保护</small>
  </form>
</div>

<div id="app" class="shell" hidden>
  <aside class="sidebar">
    <a class="brand" href="#/" aria-label="SaveVault 云端概览">
      <span class="brand-mark"><svg><use href="#i-logo"/></svg></span>
      <span class="brand-text"><strong>SaveVault</strong><small id="brand-version">CLOUD</small></span>
    </a>
    <nav class="nav" id="nav" aria-label="主导航">
      <span class="nav-label">工作台</span>
      <a href="#/" data-route="overview" title="概览" aria-label="概览"><svg><use href="#i-home"/></svg><span>概览</span></a>
      <a href="#/saves" data-route="saves" title="存档" aria-label="存档"><svg><use href="#i-saves"/></svg><span>存档</span><em id="nav-saves"></em></a>
      <a href="#/savevault" data-route="savevault" title="SaveVault" aria-label="SaveVault"><svg><use href="#i-archive"/></svg><span>SaveVault</span><em id="nav-savevault"></em></a>
      <span class="nav-label">接入与租户</span>
      <a href="#/devices" data-route="devices" title="设备" aria-label="设备"><svg><use href="#i-devices"/></svg><span>设备</span><em id="nav-devices"></em></a>
      <a href="#/users" data-route="users" title="用户" aria-label="用户"><svg><use href="#i-user"/></svg><span>用户</span></a>
      <a href="#/tokens" data-route="tokens" title="令牌" aria-label="令牌"><svg><use href="#i-shield"/></svg><span>令牌</span></a>
      <span class="nav-label">审计与维护</span>
      <a href="#/activity" data-route="activity" title="活动" aria-label="活动"><svg><use href="#i-activity"/></svg><span>活动</span></a>
      <a href="#/maintenance" data-route="maintenance" title="维护" aria-label="维护"><svg><use href="#i-tools"/></svg><span>维护</span></a>
    </nav>
    <div class="sidebar-foot">
      <button class="icon-btn" type="button" data-action="theme" title="切换主题" aria-label="切换主题"><svg><use href="#i-moon"/></svg></button>
      <button class="icon-btn" type="button" data-action="refresh" title="刷新" aria-label="刷新"><svg><use href="#i-refresh"/></svg></button>
      <button class="icon-btn" type="button" data-action="logout" title="退出登录" aria-label="退出登录"><svg><use href="#i-logout"/></svg></button>
    </div>
  </aside>
  <main class="main" id="main" tabindex="-1"></main>
</div>

<div class="modal-root" id="modal-root" hidden></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
